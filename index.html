<style>
:root{color-scheme:only light;--ink:#fff;--dim:rgba(255,255,255,.62);--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.18);--bg1:#2a6fdb;--bg2:#7fb7f5;--bg3:#16356b}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;overflow-x:hidden;overflow-x:clip}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;transition:background 1s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
body.night{--bg1:#0b1431;--bg2:#1c2f66;--bg3:#050914}
body.grey{--bg1:#4b5666;--bg2:#8591a3;--bg3:#2c333f}
#splash{position:fixed;inset:0;z-index:9;display:grid;place-items:center;overflow:hidden;background:linear-gradient(180deg,#2a6fdb,#7fb7f5);transition:opacity 1s .1s,visibility 1s .1s}
#splash.off{opacity:0;visibility:hidden}
#splash .s{font-size:88px;animation:spin 6s linear infinite,pop 1s cubic-bezier(.2,1.4,.4,1) both}
#splash p{position:absolute;bottom:18%;font-weight:600;letter-spacing:.02em;opacity:.8;animation:fade 1.2s .4s both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.98)}}
main{max-width:640px;margin:0 auto;padding:18px 16px 48px}
.seg{display:flex;background:var(--glass);border-radius:12px;padding:3px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);width:max-content;margin:0 auto 14px}
.seg button{border:0;background:none;color:var(--ink);font:600 14px inherit;font-family:inherit;padding:8px 18px;border-radius:10px;cursor:pointer;transition:background .25s}
.seg button.on{background:rgba(255,255,255,.3)}
.hero{text-align:center;padding:14px 0 22px;animation:up .8s .2s both}
.hero .city{font-size:26px;font-weight:500}
.hero .t{font-size:112px;font-weight:200;line-height:1;letter-spacing:-.04em;margin:2px 0 0 .1em}
.hero .d{font-size:19px;font-weight:500}
.hero .hl{color:var(--dim);margin-top:4px;font-size:16px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px;backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);animation:up .7s both;animation-delay:calc(.45s + var(--i,0)*.09s)}
.card h2{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:10px}
.hours{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;scroll-padding:0 10px}
.hours div{flex:0 0 52px;text-align:center;font-size:14px}
.hours span{display:block;color:var(--dim);font-size:13px}
.hours b{display:block;font-size:22px;font-weight:400;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.grid .card{margin:0}
.big{font-size:32px;font-weight:500;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:14px;margin-top:4px;line-height:1.35}
.moon{font-size:46px;line-height:1}
.row{display:grid;grid-template-columns:78px 30px 1fr 52px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.row:first-of-type{border:0}
.row .n{font-weight:500}.row .n small{display:block;color:var(--dim);font-size:12px;font-weight:400}
.row.past{opacity:.6}
.bar{display:flex;align-items:center;gap:8px;font-size:15px}
.bar i{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.25);position:relative;overflow:hidden}
.bar i u{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7fd1ff,#ffd45e,#ff9a4d);transform-origin:left;animation:grow 1s 1.2s both}
@keyframes grow{from{transform:scaleX(0)}}
.bar span{width:30px;text-align:right}.bar span:first-child{color:var(--dim)}
.x{text-align:right;font-size:13px;color:var(--dim);line-height:1.3}
.foot{color:var(--dim);font-size:12px;text-align:center;line-height:1.5;margin-top:18px}
.err{background:rgba(255,60,60,.3);padding:16px;border-radius:16px;text-align:center}
.orbs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.orbs b{position:absolute;border-radius:50%;filter:blur(60px);opacity:.4;animation:fl 18s ease-in-out infinite alternate}
.orbs b:nth-child(1){width:340px;height:340px;background:#ffd36b;top:-90px;right:-110px}
.orbs b:nth-child(2){width:300px;height:300px;background:#6fd3ff;top:42%;left:-120px;animation-delay:-6s}
.orbs b:nth-child(3){width:280px;height:280px;background:#b690ff;bottom:-90px;right:8%;animation-delay:-12s}
@keyframes fl{to{transform:translate(-50px,70px) scale(1.18)}}
@keyframes bob{50%{transform:translateY(-5px) rotate(6deg)}}
.ic{display:inline-block;animation:bob 3.2s ease-in-out infinite}

.row{cursor:pointer;border-radius:12px;transition:background .2s}
.row:hover,.row:active{background:rgba(255,255,255,.1)}
.row.past>*{opacity:.6}
.tip{color:var(--dim);font-size:13px;margin:-4px 0 6px}
.card{transition:transform .3s}.card:hover{transform:translateY(-2px)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.4s;z-index:5}
#ov.open{opacity:1;visibility:visible}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;height:88vh;z-index:6;background:rgba(22,32,58,.84);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);border-radius:28px 28px 0 0;border:1px solid var(--line);transform:translateY(105%);transition:transform .6s cubic-bezier(.2,1,.3,1)}
#sheet.open{transform:none}
#sheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:rgba(255,255,255,.35)}
#sc{height:100%;overflow-y:auto;overflow-x:hidden;overflow-x:clip;padding:26px 18px calc(34px + env(safe-area-inset-bottom));overscroll-behavior:contain}
#cl{position:absolute;top:14px;right:14px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:15px;cursor:pointer}
.sh-t{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;padding-right:36px}
.sh-i{font-size:44px;display:flex;align-items:center;gap:12px;margin:6px 0}.sh-i span{font-size:30px;font-weight:300}
.sh-l{font-size:15px;line-height:1.5;margin-bottom:3px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.chip{background:rgba(255,255,255,.1);border-radius:16px;padding:12px;animation:up .5s both}
.chip small{display:block;color:var(--dim);font-size:12px;margin-bottom:2px}.chip b{font-size:21px;font-weight:500}
.sh-h{font-size:13px;font-weight:600;color:var(--dim);margin:20px 0 8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;transform-origin:bottom;animation:gy .7s cubic-bezier(.2,1.2,.4,1) both}
.bars .rn{background:linear-gradient(#6fd3ff,#2f7bff)}.bars .sn{background:linear-gradient(#ffe27a,#ff9f3d)}
@keyframes gy{from{transform:scaleY(0)}}
.ax{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px}
.crv{width:100%;height:auto;overflow:visible}
.crv polyline{fill:none;stroke:#ffd45e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.5s .3s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.mr{display:grid;grid-template-columns:1.7fr 1fr 64px;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mr span:nth-child(n+2){text-align:right}.mr.ref{font-weight:600}
.note{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.4}
.upd{color:var(--dim);font-size:13px;margin-top:6px}
.card.lt{background:rgba(255,255,255,.96);color:#0f2340;border-color:transparent;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:12px 12px 8px}
.card.lt:hover{transform:none}
.dchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.dchips button{flex:0 0 auto;width:74px;border:0;border-radius:16px;padding:9px 4px 8px;background:#eef3fa;color:#0f2340;font:inherit;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:background .25s,color .25s,transform .25s}
.dchips button:active{transform:scale(.96)}
.dchips button b{display:block;font-size:24px;margin:3px 0 1px;font-weight:400}
.dchips button em{display:block;font-style:normal;font-size:17px;font-weight:700}
.dchips button small{display:block;font-size:14px;font-weight:500;color:#7a889c}
.dchips .on{background:#1a73e8;color:#fff;box-shadow:0 6px 16px rgba(26,115,232,.4)}
.dchips .on small{color:rgba(255,255,255,.8)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 4px 12px;animation:up .4s both}
.dh strong{font-size:19px;font-weight:700;display:block}
.dh span{color:#5b6b82;font-size:13px;line-height:1.5;display:block}
.dh .tt{font-size:34px;font-weight:300;letter-spacing:-.03em;white-space:nowrap;text-align:right}
.dh .tt small{font-size:19px;color:#7a889c}
.th,.tr{display:grid;grid-template-columns:50px 30px 60px 1fr 58px 40px;align-items:center;gap:4px;padding:7px 6px;font-size:15px}
.th{color:#7a889c;font-size:12px;font-weight:600}
.tr{border-radius:12px;animation:up .35s both}
.tr:nth-child(even){background:#f3f7fc}
.tr.now{background:#dcebff;box-shadow:inset 3px 0 0 #1a73e8}
.tr>span:first-child{font-weight:600}
.ti{font-size:22px}
.pill{display:inline-block;min-width:50px;text-align:center;color:#fff;font-weight:700;font-size:16px;border-radius:999px;padding:4px 0}
.rc b{font-size:14px;font-weight:600;display:block}
.rc i{display:block;height:4px;border-radius:2px;background:#e1e9f4;margin:3px 0 1px;overflow:hidden}
.rc u{display:block;height:100%;background:#2f8cff;border-radius:2px}
.rc small{font-size:11px;color:#2f6fd0;font-weight:600}
.tr .wd{color:#33455e;font-size:14px}
.wd i{display:inline-block;font-style:normal;margin-right:3px;color:#1a73e8;font-weight:700}
.tr .sn2{color:#d68a00;font-weight:600;font-size:14px}
.tr span:nth-child(n+5),.th span:nth-child(n+5){text-align:center}
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 80% at 70% 10%,#4f9bff 0%,#2a5fd0 45%,#0f2a68 100%)}
#splash::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(rgba(255,211,107,.35),transparent 65%);top:-160px;right:-160px;animation:fl 9s ease-in-out infinite alternate}
.stage{position:relative;width:150px;height:150px;display:grid;place-items:center;animation:pop .9s cubic-bezier(.2,1.3,.4,1) both}
.sun{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc83d 60%,#ff9d2e);box-shadow:0 0 0 14px rgba(255,200,61,.18),0 0 0 32px rgba(255,200,61,.1),0 0 80px 20px rgba(255,200,61,.5);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.cloud{position:absolute;right:-26px;bottom:6px;width:112px;height:42px;background:#fff;border-radius:42px;box-shadow:0 10px 30px rgba(10,30,90,.35);animation:drift 3.2s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:52px;height:52px;left:16px;top:-26px}
.cloud::after{width:38px;height:38px;left:58px;top:-17px}
@keyframes drift{to{transform:translateX(-22px)}}
#splash h1{font-size:44px;font-weight:200;letter-spacing:.04em;margin-top:42px;animation:fade 1s .3s both}
#splash p{position:static;font-size:15px;font-weight:400;color:var(--dim);margin-top:6px;letter-spacing:.06em;opacity:1;animation:fade 1s .5s both}
.ldb{width:150px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:34px;overflow:hidden;animation:fade 1s .6s both}
.ldb u{display:block;width:45%;height:100%;border-radius:2px;background:#fff;animation:ld 1.4s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-110%)}to{transform:translateX(240%)}}
.card.lt{background:var(--glass);color:var(--ink);border-color:var(--line);box-shadow:none;padding:14px 12px 8px}
.dchips button{background:rgba(255,255,255,.12);color:#fff}
.dchips button small{color:var(--dim)}
.dchips .on{background:#1a73e8;color:#fff;box-shadow:0 6px 18px rgba(26,115,232,.5)}
.dchips .on small{color:rgba(255,255,255,.85)}
.dh span,.dh .tt small,.th{color:var(--dim)}
.tr:nth-child(even){background:rgba(255,255,255,.06)}
.tr.now{background:rgba(255,255,255,.2);box-shadow:inset 3px 0 0 #6fb4ff}
.rc i{background:rgba(255,255,255,.2)}.rc u{background:#6fb4ff}.rc small{color:#a9d3ff}
.tr .wd{color:rgba(255,255,255,.9)}.wd i{color:#a9d3ff}
.tr .sn2{color:#ffd45e}
#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:4;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#rb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:56px;z-index:4;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:20px;line-height:1;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#rb.spin{animation:spin .8s linear infinite}
#app.quiet *{animation:none!important}
#mm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:12px;z-index:4;width:280px;max-width:calc(100% - 24px);background:rgba(22,32,58,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:18px;padding:8px;display:none;transform-origin:top right;max-height:78vh;overflow-y:auto}
#mm.open{display:block;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
#mm h3{font-size:12px;color:var(--dim);font-weight:600;padding:6px 10px}
#mm button{display:block;width:100%;text-align:left;border:0;background:none;color:#fff;font:inherit;font-size:15px;padding:10px;border-radius:12px;cursor:pointer}
#mm button:hover{background:rgba(255,255,255,.1)}
#mm button small{display:block;color:var(--dim);font-size:12px;margin-top:1px}
#mm button.on{background:rgba(26,115,232,.55)}
#mm h3.cn{margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
#mm p{color:var(--dim);font-size:12px;line-height:1.4;padding:8px 10px 4px}
main{padding-top:58px}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{flex:0 0 auto;white-space:nowrap}
.xx{margin-left:8px;opacity:.75;font-size:12px;padding:2px 4px}
#cp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);left:12px;right:12px;max-width:420px;margin:0 auto;z-index:7;background:rgba(22,32,58,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:20px;padding:12px;display:none;max-height:75vh;overflow-y:auto;scrollbar-width:none}
#cp::-webkit-scrollbar{display:none}
#cp.open{display:block;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
#cp h3{font-size:12px;color:var(--dim);font-weight:600;margin:14px 4px 6px}
#cp h3:first-child{margin-top:2px}
#ci{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:16px;outline:none}
#ci::placeholder{color:var(--dim)}
#cr button{display:block;width:100%;text-align:left;border:0;background:none;color:#fff;font:inherit;font-size:16px;padding:10px;border-radius:12px;cursor:pointer}
#cr button:hover,#cr button:active{background:rgba(255,255,255,.12)}
#cr button small,.sv small{display:block;color:var(--dim);font-size:12px;margin-top:1px}
.sv{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:16px}
.sv button{border:0;background:rgba(255,255,255,.15);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer}
#cp p{color:var(--dim);font-size:13px;padding:6px 4px}
#sb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:100px;z-index:4;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:18px;line-height:1;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#sp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:12px;z-index:4;width:300px;max-width:calc(100% - 24px);background:rgba(22,32,58,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:18px;padding:8px;display:none;transform-origin:top right;max-height:78vh;overflow-y:auto}

.useg{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;margin:2px 6px 6px}
.useg button{flex:1;border:0;background:none;color:#fff;font:inherit;font-size:14px;padding:8px;border-radius:8px;cursor:pointer;transition:background .25s}
.useg button.on{background:rgba(255,255,255,.3)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;font-size:15px;cursor:pointer;gap:10px}
.sw input{display:none}
.sw i{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative;transition:background .3s;flex:0 0 auto}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.sw input:checked+i{background:#34c759}

.info p{color:rgba(255,255,255,.85);font-size:13px;line-height:1.45;padding:6px 10px}

.sh i{width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg) translate(-2px,-2px);transition:transform .45s cubic-bezier(.2,.8,.2,1);flex:0 0 auto;margin-right:4px}
.cb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1),opacity .4s,margin-top .5s;margin-top:10px}

.sec.closed .cb{grid-template-rows:0fr;opacity:0;margin-top:0}
.sec.closed .sh i{transform:rotate(-45deg) translate(-2px,-2px)}
.sec .grid .card{background:rgba(255,255,255,.08);border:0;backdrop-filter:none;-webkit-backdrop-filter:none;animation:none}
.sec .grid .card:hover{transform:none}

/* ===== Neues Design ===== */
:root{--bg1:#4c8fe0;--bg2:#8cc0ee;--bg3:#3568b0;--glass:rgba(255,255,255,.16);--line:rgba(255,255,255,.14)}
body.night{--bg1:#0e1a3a;--bg2:#24376f;--bg3:#080d1f}
body.grey{--bg1:#5a6678;--bg2:#919cad;--bg3:#39424f}
.orbs{display:none}
main{max-width:600px;padding:62px 16px 56px}
.hero{padding:6px 0 26px}
.hero .city{font-size:28px;font-weight:600;letter-spacing:-.01em}
.hero .t{font-size:104px;font-weight:200;letter-spacing:-.05em}
.hero .d{font-size:20px;font-weight:500}
.hero .hl{font-size:17px;font-weight:500;color:var(--ink)}
.upd{font-size:12px;opacity:.8}
.card{border:0;border-radius:24px;padding:16px 18px;margin-bottom:14px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6)}
.card:hover{transform:none}

  if(L==="wolken")return{fr:(RD&&RD.satF)||[],i:(RD&&RD.sidx)||0,set:v=>{RD.sidx=v}};
  if(L==="wind"||L==="schnee")return{fr:(RD&&RD.wndF)||[],i:(RD&&RD.widx)||0,set:v=>{RD.widx=v}};
  return{fr:(RD&&RD.frames)||[],i:(RD&&RD.idx)||0,set:v=>{RD.idx=v}};
}
function layerTimeText(L,fr){
  try{
    if(!fr||fr.time==null)return"lädt …";
    const ms=L==="regen"?(RD.src==="dwd"?fr.time:fr.time*1e3):fr.time;
    const t=new Date(ms).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr";
    if(L==="regen")return t+(RD.src==="dwd"?" · vor "+Math.max(0,Math.round((Date.now()-ms)/60000))+" Min":"");
    const h=Math.max(0,Math.round((Date.now()-ms)/3600000));
    return t+(h<1?" · gerade jetzt":" · vor "+h+" Std.");
  }catch(e){return"–"}
}

async function radarCities(my){

    const la=RCITIES.map(x=>x[1]).join(","),lo=RCITIES.map(x=>x[2]).join(",");
    const j=await get(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,wind_speed_10m,wind_direction_10m&daily=snowfall_sum&forecast_days=2&timezone=Europe%2FBerlin`,12000).catch(()=>null);
    if(my!==RDRUN)return null;
    if(j){const arr=Array.isArray(j)?j:[j],o={};
      const today=new Date().toISOString().slice(0,10);
      arr.forEach((w,i)=>{if(!w||!RCITIES[i])return;
        const t=w.current&&w.current.temperature_2m;
        if(t==null)return;
        let sn=null;try{const dt=(w.daily&&w.daily.time)||[],sv=(w.daily&&w.daily.snowfall_sum)||[];let k=dt.findIndex(x=>x>=today);if(k<0)k=0;sn=sv[k];if(sn==null)sn=0}catch(e2){sn=null}

function recolorTile(im){
  try{
    const cv=document.createElement("canvas");cv.width=256;cv.height=256;
    const x=cv.getContext("2d");x.drawImage(im,0,0,256,256);
    const d=x.getImageData(0,0,256,256),p=d.data;
    for(let i=0;i<p.length;i+=4){
      const a=p[i+3];if(a<40){p[i+3]=0;continue}
      const r=p[i],g=p[i+1],b=p[i+2];
      let nr,ng,nb;
      if(r>200&&g>200&&b>200){nr=255;ng=255;nb=255}
      else if(r>170&&b>170&&g<160){nr=255;ng=227;nb=247}
      else if(r>b+10){
        const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
        if(mx-mn>120){nr=194;ng=107;nb=255}
        else{nr=143;ng=208;nb=255}
      }else{
        const inten=(b-r)/180*0.6+(1-(r+g+b)/765)*0.4;
        if(inten>0.85){nr=194;ng=107;nb=255}
        else if(inten>0.55){nr=122;ng=60;nb=255}
        else if(inten>0.28){nr=47;ng=123;nb=255}
        else{nr=143;ng=208;nb=255}
      }
      p[i]=nr;p[i+1]=ng;p[i+2]=nb;p[i+3]=Math.min(255,a+50);
    }
    x.putImageData(d,0,0);
    return cv.toDataURL();
  }catch(e){return null}
}

function tabs(active){
  /* Doppelte Orte zusammenfassen: anderer Eintrag am selben Platz (Name gleich oder <3 km) → builtin verstecken; gleiche Namen → nur einer (eigene > Standort > Rest). Der aktive Reiter bleibt immer sichtbar. */
  let vis=Object.entries(CITIES);
  try{
    const norm=s=>String((s&&s.n)||s||"").toLowerCase().trim();
    const dd=(a,b)=>{try{return hav(a.lat,a.lon,b.lat,b.lon)}catch(e){return 99}};
    const rank=c=>c.custom?0:(c.gps?1:2);
    const hide=new Set();
    const groups={};
    vis.forEach(([k,c])=>{(groups[norm(c)]=groups[norm(c)]||[]).push([k,c])});
    Object.values(groups).forEach(g=>{
      if(g.length<2)return;
      g.sort((a,b)=>rank(a[1])-rank(b[1]));
      const keep=g.some(([k])=>k===active)?active:g[0][0];
      g.forEach(([k])=>{if(k!==keep)hide.add(k)});
    });
    vis.forEach(([k,c])=>{
      if(!c.builtin||hide.has(k))return;
      const near=vis.filter(([k2,c2])=>k2!==k&&!hide.has(k2)&&norm(c2)!==norm(c)&&dd(c,c2)<3);
      if(!near.length)return;
      if(k===active)near.forEach(([k2])=>{if(k2!==active)hide.add(k2)});
